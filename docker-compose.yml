services:
     app:
       build: .
       image: devops-mini-flask:day2
       container_name: flask-demo
       restart: unless-stopped
       networks:
         - devnet

     nginx:
       image: nginx:stable
       container_name: nginx-proxy
       depends_on:
         - app
       volumes:
         - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
       ports:
         - "8080:80"
       networks:
         - devnet
networks:
  devnet:
    driver: bridge
